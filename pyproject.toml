[project]
name = "ai-pipeline-hook"
version = "0.1.0"
description = "Hook 排程系統 — pipelines (YAML) + shared runner + Claude Code"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
